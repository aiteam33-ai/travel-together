<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  // Decide light/dark before first paint, so there is no flash.
  (function () {
    try {
      var saved = localStorage.getItem("foodTruckTheme");
      var theme =
        saved === "light" || saved === "dark"
          ? saved
          : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      document.documentElement.setAttribute("data-theme", theme);
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "light");
    }
  })();
</script>
<title id="pageTitle">THE PANNEL HOUSE</title>
<style>
  :root {
    /* ======================================================
       COLOUR THEME — edit values here to change the look.
       Light mode values live here; dark mode overrides are in
       the [data-theme="dark"] block right below.
       ====================================================== */
    --bg: #f3e9da;              /* page background: warm beige */
    --header-bg: #6b4226;       /* rich brown: header, nav bar, bottom cart bar, buttons */
    --header-text: #fdf6ec;     /* cream text on the rich brown */
    --card-bg: #fbf3e7;         /* lighter cream surface: dish cards, cart panel, order cards */
    --card-border: #d8c3a5;     /* thin soft brown border */
    --group-color: #5a3620;     /* rich brown text: section headings, totals */
    --price-color: #4a2f1c;     /* dark brown: prices */
    --button-bg: #6b4226;       /* rich brown: Add, plus, minus, Close buttons */
    --button-text: #fdf6ec;     /* cream text on brown buttons */
    --button-active: #4a2f1c;   /* darker brown: pressed/hover state */
    --veg: #2e8b2e;             /* green veg dot — unchanged */
    --nonveg: #c0392b;          /* red non-veg dot — unchanged */
    --text: #3b2415;            /* main text: dark brown */
    --text-secondary: #8a7257;  /* soft brown-grey: secondary text */
    --dot-border: #6b5a44;      /* border around veg/non-veg dots */
    --overlay-bg: rgba(40, 25, 10, 0.4); /* warm dark, slightly see-through, behind the cart */
    --focus: #0ea5e9;           /* bright colour for keyboard focus outlines */
  }

  :root[data-theme="dark"] {
    --bg: #1c130c;              /* page background: very dark brown */
    --header-bg: #c98a3e;       /* warm caramel brown: header, nav bar, bottom cart bar, buttons */
    --header-text: #2a1a0d;     /* dark text on the caramel, for contrast */
    --card-bg: #3b2a1c;         /* chocolate brown surface: dish cards, cart panel, order cards */
    --card-border: #5a432e;     /* lighter brown divider */
    --group-color: #e8c99a;     /* light caramel text: section headings, totals */
    --price-color: #e9dcc9;     /* light beige: prices */
    --button-bg: #c98a3e;       /* warm caramel: Add, plus, minus, Close buttons */
    --button-text: #2a1a0d;     /* dark text on caramel buttons, for contrast */
    --button-active: #d89a4e;   /* lighter caramel: pressed/hover state */
    --veg: #3fbf3f;             /* green veg dot, brightened for dark backgrounds */
    --nonveg: #e2574c;          /* red non-veg dot, brightened for dark backgrounds */
    --text: #ecdfc9;            /* main text: light beige */
    --text-secondary: #b2a083;  /* muted beige-grey: secondary text */
    --dot-border: #cbb892;      /* border around veg/non-veg dots, visible on dark */
    --overlay-bg: rgba(10, 5, 0, 0.6); /* dark, slightly see-through, behind the cart */
    --focus: #33e1ff;           /* bright colour for keyboard focus outlines */

    transform: translateY(-40px);
    pointer-events: none;
  }

  @media (prefers-reduced-motion: reduce) {
    #page-welcome {
      transition: none;
    }
  }

  .welcome-content {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px 20px 40px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .welcome-top-row {
    width: 100%;
    display: flex;
    justify-content: flex-end;
  }

  .welcome-top-row .theme-toggle-btn {
    border-color: var(--card-border);
    color: var(--text);
  }

  .pizza-oven {
    width: 180px;
    height: 140px;
    overflow: visible;
  }

  .oven-paddle-pizza {
    transform: translateX(0);
  }

  @media (prefers-reduced-motion: no-preference) {
    .oven-paddle-pizza {
      animation: ovenSlideOut 1.1s ease-out 0.2s both;
    }

    .oven-steam {
      animation: ovenSteamRise 2.5s ease-in-out infinite;
    }
  }

  @keyframes ovenSlideOut {
    from { transform: translateX(-55px); }
    to { transform: translateX(0); }
  }

  @keyframes ovenSteamRise {
    0% { transform: translateY(0) scale(1); opacity: 0.7; }
    50% { transform: translateY(-14px) scale(1.15); opacity: 0.3; }
    100% { transform: translateY(-28px) scale(1.3); opacity: 0; }
  }

  .welcome-title {
    margin: 0;
    font-size: 2.3rem;
    letter-spacing: 1px;
    color: var(--group-color);
  }

  .welcome-tagline {
    margin: 0;
    font-size: 1.05rem;
    color: var(--text-secondary);
    font-style: italic;
  }

  .welcome-greeting {
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    color: var(--text);
  }

  .welcome-special {
    display: none;
    width: 100%;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 14px 16px;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .welcome-special.show {
    display: flex;
  }

  .welcome-special-btn,
  .welcome-continue-btn {
    min-height: 44px;
    background: var(--button-bg);
    color: var(--button-text);
    border: none;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 700;
    padding: 0 18px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .welcome-special-btn:active,
  .welcome-continue-btn:active {
    background: var(--button-active);
  }

  .welcome-coupon-banner {
    display: none;
    width: 100%;
    background: var(--card-bg);
    border: 1px dashed var(--button-bg);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 0.9rem;
    color: var(--group-color);
    font-weight: 600;
  }

  .welcome-coupon-banner.show {
    display: block;
  }

  .welcome-continue {
    display: none;
    width: 100%;
  }

  .welcome-continue.show {
    display: block;
  }

  .welcome-continue-btn {
    width: 100%;
  }

  .start-ordering-btn {
    width: 100%;
    min-height: 56px;
    background: var(--button-bg);
    color: var(--button-text);
    border: none;
    border-radius: 14px;
    font-size: 1.25rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 6px;
  }

  .start-ordering-btn:active {
    background: var(--button-active);
  }

  .welcome-facts {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 6px;
  }

  .welcome-fact {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text-secondary);
  }
</style>
</head>
<body>

<div class="page active" id="page-welcome">
  <div class="welcome-content">
    <div class="welcome-top-row">
      <button class="theme-toggle-btn" id="themeToggleBtnWelcome"></button>
    </div>

    <div class="pizza-oven" aria-hidden="true">
      <svg class="pizza-oven-svg" viewBox="0 0 220 160" width="180" height="140">
        <ellipse cx="110" cy="150" rx="95" ry="8" fill="var(--card-border)" opacity="0.5"></ellipse>
        <path d="M20,140 L20,80 A90,90 0 0 1 200,80 L200,140 Z" fill="var(--header-bg)"></path>
        <ellipse cx="110" cy="140" rx="90" ry="13" fill="var(--button-active)"></ellipse>
        <ellipse cx="110" cy="102" rx="45" ry="36" fill="var(--text)" opacity="0.85"></ellipse>
        <g class="oven-steam" style="animation-delay: 0s">
          <path d="M90,62 q-6,-14 0,-26 q6,-12 0,-24" stroke="var(--card-bg)" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"></path>
        </g>
        <g class="oven-steam" style="animation-delay: 0.6s">
          <path d="M110,58 q-6,-14 0,-26 q6,-12 0,-24" stroke="var(--card-bg)" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"></path>
        </g>
        <g class="oven-steam" style="animation-delay: 1.1s">
          <path d="M130,62 q-6,-14 0,-26 q6,-12 0,-24" stroke="var(--card-bg)" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"></path>
        </g>
        <g class="oven-paddle-pizza">
          <rect x="95" y="118" width="110" height="10" rx="4" fill="var(--price-color)"></rect>
          <circle cx="100" cy="112" r="30" fill="#e8b974"></circle>
          <circle cx="100" cy="112" r="26" fill="#d1452b"></circle>
          <circle cx="90" cy="105" r="4" fill="#f4e3b2"></circle>
          <circle cx="108" cy="118" r="4" fill="#f4e3b2"></circle>
          <circle cx="100" cy="98" r="3.5" fill="#6b8f3e"></circle>
          <circle cx="114" cy="102" r="3.5" fill="#6b8f3e"></circle>

    <h1 class="welcome-title" id="welcomeTitle">THE PANNEL HOUSE</h1>
    <p class="welcome-tagline" id="welcomeTagline"></p>
    <p class="welcome-greeting" id="welcomeGreeting"></p>

    <div class="welcome-special" id="welcomeSpecial">
      <span id="welcomeSpecialText"></span>

    </div>

    <div class="welcome-coupon-banner" id="welcomeCouponBanner">
      New here? Use FIRST10 for 10% off your first order.
    </div>

    <div class="welcome-continue" id="welcomeContinue">
      <button class="welcome-continue-btn" id="welcomeContinueBtn"></button>
    </div>

    <button class="start-ordering-btn" id="startOrderingBtn">Start Ordering</button>

    <div class="welcome-facts" id="welcomeFacts"></div>
  </div>
</div>

<div class="page" id="page-main">
  <header>
    <h1 id="restaurantNameHeading">THE PANNEL HOUSE</h1>
    <p>Fresh Italian, made to order</p>
  </header>

  <div class="menu-group best-sellers-section" id="bestSellersGroup">
    <h2 class="group-title">Best Sellers</h2>
    <div class="dish-row-wrapper">
      <div class="dish-row" id="bestSellersRow"></div>
    </div>
  </div>

  <div class="nav-row">
    <button class="nav-link-btn" id="myOrdersLink">My Orders</button>
    <button class="theme-toggle-btn" id="themeToggleBtn"></button>
  </div>

  <main id="menu"></main>

  <footer id="footerText">THE PANNEL HOUSE &middot; All dishes are vegetarian</footer>

  <div class="cart-bar" id="cartBar">
    <span id="cartBarText">0 items</span>
    <span id="cartBarTotal">Rs 0</span>
  </div>

  <div class="cart-overlay" id="cartOverlay">
    <div class="cart-panel">
      <div class="cart-panel-header">
        <h2>Your Table</h2>
        <button class="cart-close-btn" id="cartCloseBtn" aria-label="Close cart">&times;</button>
      </div>
      <div id="cartBody"></div>

  </div>
</div>

<div class="page" id="page-orders">
  <div class="sub-header">
    <h1>My Orders</h1>
    <button class="back-link-page" id="ordersBackLink">&larr; Back to menu</button>
  </div>
  <div class="orders-list" id="ordersList"></div>
</div>

<div class="page" id="page-tracking">
  <div class="sub-header">
    <h1 id="trackingTitle">Order</h1>
    <button class="back-link-page" id="trackingBackLink">&larr; Back to My Orders</button>
  </div>
  <div class="tracking-page-content" id="trackingContent"></div>
</div>

<script>
  // ============================================================
  // MENU DATA — edit prices, names or dishes only in this block.
  // Everything below (design + logic) reads from this data.
  // veg: true = green dot, false = red dot.
  // ============================================================
  const MENU = [
    {
      group: "Antipasti",
      groupEnglish: "Starters",
      items: [
        { name: "Bruschetta al Pomodoro", price: 180, veg: true, bestSeller: true },
        { name: "Garlic Focaccia Bites", price: 160, veg: true },
        { name: "Caprese Salad", price: 220, veg: true },
        { name: "Arancini (3 pcs)", price: 240, veg: true },
        { name: "Stuffed Mushrooms", price: 230, veg: true },
      ],
    },
    {
      group: "Pizza",
      items: [
        { name: "Margherita", price: 320, veg: true, bestSeller: true },
        { name: "Four Cheese (Quattro Formaggi)", price: 420, veg: true },
        { name: "Garden Veggie (Ortolana)", price: 380, veg: true },
        { name: "Pesto Paneer", price: 400, veg: true },
        { name: "Mushroom and Truffle", price: 440, veg: true, todaysSpecial: true },
      ],
    },
    {
      group: "Pasta",
      items: [
        { name: "Penne Arrabbiata", price: 300, veg: true },
        { name: "Spaghetti Aglio e Olio", price: 290, veg: true },
        { name: "Fettuccine Alfredo", price: 340, veg: true, bestSeller: true },
        { name: "Pesto Genovese", price: 330, veg: true },
        { name: "Baked Lasagna", price: 380, veg: true },
        { name: "Mushroom Ravioli", price: 360, veg: true },
      ],
    },
    {
      group: "Risotto and Mains",
      items: [
        { name: "Mushroom Risotto", price: 350, veg: true, bestSeller: true },
        { name: "Spinach and Ricotta Cannelloni", price: 370, veg: true },
        { name: "Eggplant Parmigiana", price: 340, veg: true },
      ],
    },
    {
      group: "Breads and Sides",
      items: [
        { name: "Garlic Bread", price: 120, veg: true, bestSeller: true },
        { name: "Cheese Garlic Bread", price: 160, veg: true },
        { name: "Rosemary Focaccia", price: 150, veg: true },
        { name: "Parmesan Fries", price: 140, veg: true },
      ],
    },
    {
      group: "Bevande",
      groupEnglish: "Drinks",
      items: [
        { name: "Espresso", price: 90, veg: true },
        { name: "Cappuccino", price: 130, veg: true, bestSeller: true },
        { name: "Iced Peach Tea", price: 120, veg: true },
        { name: "Italian Soda", price: 110, veg: true },
        { name: "Fresh Lemonade", price: 90, veg: true },
      ],
    },
    {
      group: "Dolci",
      groupEnglish: "Desserts",
      items: [
        { name: "Tiramisu", price: 220, veg: true, bestSeller: true },
        { name: "Panna Cotta", price: 200, veg: true },
        { name: "Cannoli (2 pcs)", price: 190, veg: true },
        { name: "Gelato, two scoops", price: 160, veg: true },
        { name: "Affogato", price: 180, veg: true },
      ],
    },
  ];

  // ============================================================
  // COUPON SETTINGS — edit the code, discount, or first-order
  // rule here; the cart logic below just reads these values.
  // ============================================================
  const COUPON = {
    code: "FIRST10",
    percent: 10,
    firstOrderOnly: true,
  };

  // ============================================================
  // RESTAURANT SETTINGS — name, tagline, facts and greetings for
  // the welcome page. Change the name here to rename it everywhere.
  // ============================================================
  const RESTAURANT = {
    name: "THE PANNEL HOUSE",
    tagline: "Wood-fired pizza, fresh pasta, made with love",
    facts: ["100% Vegetarian", "Wood-fired", "Freshly made"],
    greetings: [
      { maxHour: 12, it: "Buongiorno", en: "good morning" },
      { maxHour: 17, it: "Buon pomeriggio", en: "good afternoon" },
      { maxHour: 24, it: "Buonasera", en: "good evening" },
    ],
  };

  // ============================================================
  // PAGE LOGIC — builds the menu list from MENU above.
  // ============================================================

  function buildDishCard(dish, groupName) {
    const card = document.createElement("div");
    card.className = "dish-card";

    if (dish.bestSeller) {
      const badge = document.createElement("span");
      badge.className = "best-seller-badge";
      badge.textContent = "Best Seller";
      card.appendChild(badge);
    } else if (dish.todaysSpecial) {
      const badge = document.createElement("span");
      badge.className = "best-seller-badge";
      badge.textContent = "Today's Special";
      card.appendChild(badge);
    }

    if (groupName) {
      const groupLabel = document.createElement("span");
      groupLabel.className = "dish-card-group-label";
      groupLabel.textContent = groupName;
      card.appendChild(groupLabel);
    }

    const top = document.createElement("div");
    top.className = "dish-card-top";

    const dot = document.createElement("span");
    dot.className = "dot " + (dish.veg ? "veg" : "nonveg");

    const name = document.createElement("span");
    name.className = "dish-name";
    name.textContent = dish.name;

    top.appendChild(dot);
    top.appendChild(name);

    const price = document.createElement("span");
    price.className = "dish-price";
    price.textContent = "Rs " + dish.price;

    const addBtn = document.createElement("button");
    addBtn.className = "add-btn";
    addBtn.textContent = "Add";
    addBtn.addEventListener("click", () => addToCart(dish.name));

    card.appendChild(top);
    card.appendChild(price);
    card.appendChild(addBtn);
    return card;
  }

  function buildGroupHeading(section) {
    const heading = document.createElement("h2");
    heading.className = "group-title";
    heading.textContent = section.group;
    if (section.groupEnglish) {
      const subtitle = document.createElement("span");
      subtitle.className = "group-subtitle";
      subtitle.textContent = section.groupEnglish;
      heading.appendChild(subtitle);
    }
    return heading;
  }

  function buildScrollRow(row) {
    const rowWrapper = document.createElement("div");
    rowWrapper.className = "dish-row-wrapper";

    const leftArrow = document.createElement("button");
    leftArrow.className = "scroll-arrow left";
    leftArrow.textContent = "‹";
    leftArrow.setAttribute("aria-label", "Scroll left");
    leftArrow.addEventListener("click", () => {
      row.scrollBy({ left: -240, behavior: "smooth" });
    });

    const rightArrow = document.createElement("button");
    rightArrow.className = "scroll-arrow right";
    rightArrow.textContent = "›";
    rightArrow.setAttribute("aria-label", "Scroll right");
    rightArrow.addEventListener("click", () => {
      row.scrollBy({ left: 240, behavior: "smooth" });
    });

    rowWrapper.appendChild(row);
    rowWrapper.appendChild(leftArrow);
    rowWrapper.appendChild(rightArrow);
    return rowWrapper;
  }

  function renderBestSellers() {
    const group = document.getElementById("bestSellersGroup");
    const row = document.getElementById("bestSellersRow");
    row.innerHTML = "";

    const bestSellers = [];
    MENU.forEach((section) => {
      const dish = section.items.find((d) => d.bestSeller);
      if (dish) bestSellers.push({ dish: dish, groupName: section.group });
    });

    if (bestSellers.length === 0) {
      group.classList.remove("show");
      return;
    }

    group.classList.add("show");
    bestSellers.forEach(({ dish, groupName }) => {
      row.appendChild(buildDishCard(dish, groupName));
    });
  }

  document.title = RESTAURANT.name;
  document.getElementById("restaurantNameHeading").textContent = RESTAURANT.name;
  document.getElementById("footerText").textContent = RESTAURANT.name + " · All dishes are vegetarian";

  renderBestSellers();

  function renderMenu() {
    const container = document.getElementById("menu");
    container.innerHTML = "";

    MENU.forEach((section) => {
      if (section.items.length === 0) return;

      const group = document.createElement("div");
      group.className = "menu-group";

      group.appendChild(buildGroupHeading(section));

      const row = document.createElement("div");
      row.className = "dish-row";

      section.items.forEach((dish) => {
        row.appendChild(buildDishCard(dish, null));
      });

      group.appendChild(buildScrollRow(row));
      container.appendChild(group);
    });
  }

  renderMenu();

  // ============================================================
  // DARK / LIGHT MODE — the initial choice is set before paint by
  // the tiny script in <head>; this just keeps the toggle in sync.
  // ============================================================
  const THEME_STORAGE_KEY = "foodTruckTheme";
  const themeToggleBtn = document.getElementById("themeToggleBtn");
  const themeToggleBtnWelcome = document.getElementById("themeToggleBtnWelcome");
  const themeToggleButtons = [themeToggleBtn, themeToggleBtnWelcome];

  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    themeToggleButtons.forEach((btn) => {
      btn.textContent = theme === "dark" ? "☀" : "🌙";
      btn.setAttribute(
        "aria-label",
        theme === "dark" ? "Switch to light mode" : "Switch to dark mode"
      );
    });
  }

  applyTheme(document.documentElement.getAttribute("data-theme") || "light");

  function toggleTheme() {
    const current = document.documentElement.getAttribute("data-theme");
    const next = current === "dark" ? "light" : "dark";
    try {
      localStorage.setItem(THEME_STORAGE_KEY, next);
    } catch (e) {
      // ignore storage errors (e.g. private browsing)
    }
    applyTheme(next);
  }

  themeToggleButtons.forEach((btn) => btn.addEventListener("click", toggleTheme));

  // ============================================================
  // CART — stored as { dishName: quantity }, saved to localStorage.
  // ============================================================
  const CART_STORAGE_KEY = "masalaLaneCart";

  function findDish(name) {
    for (const section of MENU) {
      const dish = section.items.find((d) => d.name === name);
      if (dish) return dish;
    }
    return null;
  }

  function loadCart() {
    try {
      const raw = localStorage.getItem(CART_STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }

  function saveCart() {
    try {
      localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
    } catch (e) {
      // ignore storage errors (e.g. private browsing)
    }
  }

  let cart = loadCart();

  // If an old menu is saved in the cart, quietly drop dishes that no
  // longer exist instead of letting them break the cart display.
  Object.keys(cart).forEach((name) => {
    if (!findDish(name)) delete cart[name];
  });
  saveCart();

  function addToCart(name) {
    cart[name] = (cart[name] || 0) + 1;
    saveCart();
    renderCartBar();
    if (cartOverlay.classList.contains("show")) renderCartBody();
  }

  function changeQty(name, delta) {
    const newQty = (cart[name] || 0) + delta;
    if (newQty <= 0) {
      delete cart[name];
    } else {
      cart[name] = newQty;
    }
    saveCart();
    renderCartBar();
    renderCartBody();
  }

  function cartCount() {
    return Object.values(cart).reduce((sum, q) => sum + q, 0);
  }

  function cartTotal() {
    return Object.entries(cart).reduce((sum, [name, q]) => {
      const dish = findDish(name);
      return sum + (dish ? dish.price * q : 0);
    }, 0);
  }

  // ============================================================
  // COUPON STATE — applied code persists across refreshes; whether
  // it's still valid is checked live against COUPON and ordersCache.
  // ============================================================
  const COUPON_STORAGE_KEY = "foodTruckCoupon";

  function loadAppliedCoupon() {
    try {
      return localStorage.getItem(COUPON_STORAGE_KEY);
    } catch (e) {
      return null;
    }
  }

  function saveAppliedCoupon(code) {
    try {
      if (code) {
        localStorage.setItem(COUPON_STORAGE_KEY, code);
      } else {
        localStorage.removeItem(COUPON_STORAGE_KEY);
      }
    } catch (e) {
      // ignore storage errors (e.g. private browsing)
    }
  }

  let appliedCouponCode = loadAppliedCoupon();
  let couponMessage = "";

  function isFirstOrder() {
    return ordersCache.length === 0;
  }

  function couponIsActive() {
    return appliedCouponCode === COUPON.code && (!COUPON.firstOrderOnly || isFirstOrder());
  }

  function cartDiscount() {
    return couponIsActive() ? Math.round((cartTotal() * COUPON.percent) / 100) : 0;
  }

  function cartFinalTotal() {
    return cartTotal() - cartDiscount();
  }

  function buildCouponBox() {
    const box = document.createElement("div");
    box.className = "coupon-box";

    if (couponIsActive()) {
      const row = document.createElement("div");
      row.className = "coupon-applied-row";

      const label = document.createElement("span");
      label.textContent = COUPON.code + " applied. You saved Rs " + cartDiscount() + ".";

      const removeBtn = document.createElement("button");
      removeBtn.className = "coupon-remove-btn";
      removeBtn.textContent = "Remove";
      removeBtn.addEventListener("click", () => {
        appliedCouponCode = null;
        saveAppliedCoupon(null);
        couponMessage = "";
        renderCartBar();
        renderCartBody();
      });

      row.appendChild(label);
      row.appendChild(removeBtn);
      box.appendChild(row);
      return box;
    }

    const label = document.createElement("label");
    label.setAttribute("for", "couponInput");
    label.textContent = "Have a coupon?";
    box.appendChild(label);

    const inputRow = document.createElement("div");
    inputRow.className = "coupon-input-row";

    const input = document.createElement("input");
    input.type = "text";
    input.id = "couponInput";
    input.placeholder = "Enter code";

    const applyBtn = document.createElement("button");
    applyBtn.type = "button";
    applyBtn.className = "coupon-apply-btn";
    applyBtn.textContent = "Apply";
    applyBtn.addEventListener("click", () => {
      const raw = input.value.trim().toUpperCase();

      if (raw !== COUPON.code) {
        couponMessage = "That code is not valid.";
      } else if (COUPON.firstOrderOnly && !isFirstOrder()) {
        couponMessage = "This code is only for your first order.";
      } else {
        appliedCouponCode = COUPON.code;
        saveAppliedCoupon(appliedCouponCode);
        couponMessage = "";
      }
      renderCartBar();
      renderCartBody();
    });

    inputRow.appendChild(input);
    inputRow.appendChild(applyBtn);
    box.appendChild(inputRow);

    if (couponMessage) {
      const message = document.createElement("div");
      message.className = "coupon-message";
      message.textContent = couponMessage;
      box.appendChild(message);
    }

    return box;
  }

  const cartBar = document.getElementById("cartBar");
  const cartBarText = document.getElementById("cartBarText");
  const cartBarTotal = document.getElementById("cartBarTotal");
  const cartOverlay = document.getElementById("cartOverlay");
  const cartBody = document.getElementById("cartBody");
  const cartCloseBtn = document.getElementById("cartCloseBtn");

  function renderCartBar() {
    const count = cartCount();
    if (count === 0) {
      cartBar.classList.remove("show");
      return;
    }
    cartBar.classList.add("show");
    cartBarText.textContent = count + (count === 1 ? " item" : " items");
    cartBarTotal.textContent = "Rs " + cartFinalTotal();
  }

  function renderCartBody() {
    cartBody.innerHTML = "";

    const entries = Object.entries(cart);

    if (entries.length === 0) {
      const empty = document.createElement("div");
      empty.className = "cart-empty";
      empty.textContent = "Your table is empty. Add something delicious from the menu!";
      cartBody.appendChild(empty);
      return;
    }

    entries.forEach(([name, qty]) => {
      const dish = findDish(name);
      if (!dish) return;

      const row = document.createElement("div");
      row.className = "cart-row";

      const rowName = document.createElement("span");
      rowName.className = "cart-row-name";
      rowName.textContent = dish.name;

      const qtyControl = document.createElement("div");
      qtyControl.className = "qty-control";

      const minusBtn = document.createElement("button");
      minusBtn.className = "qty-btn";
      minusBtn.textContent = "-";
      minusBtn.setAttribute("aria-label", "Decrease quantity");
      minusBtn.addEventListener("click", () => changeQty(name, -1));

      const qtyValue = document.createElement("span");
      qtyValue.className = "qty-value";
      qtyValue.textContent = qty;

      const plusBtn = document.createElement("button");
      plusBtn.className = "qty-btn";
      plusBtn.textContent = "+";
      plusBtn.setAttribute("aria-label", "Increase quantity");
      plusBtn.addEventListener("click", () => changeQty(name, 1));

      qtyControl.appendChild(minusBtn);
      qtyControl.appendChild(qtyValue);
      qtyControl.appendChild(plusBtn);

      const rowPrice = document.createElement("span");
      rowPrice.className = "cart-row-price";
      rowPrice.textContent = "Rs " + dish.price * qty;

      row.appendChild(rowName);
      row.appendChild(qtyControl);
      row.appendChild(rowPrice);
      cartBody.appendChild(row);
    });

    cartBody.appendChild(buildCouponBox());

    const discount = cartDiscount();
    if (discount > 0) {
      const subtotalRow = document.createElement("div");
      subtotalRow.className = "order-summary-row";
      subtotalRow.innerHTML = "<span>Subtotal</span><span>Rs " + cartTotal() + "</span>";
      cartBody.appendChild(subtotalRow);

      const discountRow = document.createElement("div");
      discountRow.className = "order-summary-row";
      discountRow.innerHTML =
        "<span>Discount (" + COUPON.code + ", " + COUPON.percent + "%)</span><span>-Rs " + discount + "</span>";
      cartBody.appendChild(discountRow);
    }

    const totalRow = document.createElement("div");
    totalRow.className = "cart-total";
    totalRow.innerHTML = "<span>Total</span><span>Rs " + cartFinalTotal() + "</span>";
    cartBody.appendChild(totalRow);

    const checkoutBtn = document.createElement("button");
    checkoutBtn.className = "checkout-btn";
    checkoutBtn.textContent = "Checkout";
    checkoutBtn.addEventListener("click", renderCheckoutForm);
    cartBody.appendChild(checkoutBtn);
  }

  // ============================================================
  // CHECKOUT — form shown inside the cart panel. Validates on
  // Place Order; no pop-ups, errors shown inline next to the field.
  // ============================================================
  function renderCheckoutForm() {
    cartBody.innerHTML = "";

    const backBtn = document.createElement("button");
    backBtn.className = "back-link";
    backBtn.textContent = "← Back to cart";
    backBtn.addEventListener("click", renderCartBody);
    cartBody.appendChild(backBtn);

    const discount = cartDiscount();
    if (discount > 0) {
      const subtotalRow = document.createElement("div");
      subtotalRow.className = "order-summary-row";
      subtotalRow.innerHTML = "<span>Subtotal</span><span>Rs " + cartTotal() + "</span>";
      cartBody.appendChild(subtotalRow);

      const discountRow = document.createElement("div");
      discountRow.className = "order-summary-row";
      discountRow.innerHTML =
        "<span>Discount (" + COUPON.code + ", " + COUPON.percent + "%)</span><span>-Rs " + discount + "</span>";
      cartBody.appendChild(discountRow);
    }

    const totalRow = document.createElement("div");
    totalRow.className = "checkout-total";
    totalRow.innerHTML = "<span>Order Total</span><span>Rs " + cartFinalTotal() + "</span>";
    cartBody.appendChild(totalRow);

    const form = document.createElement("form");
    form.id = "checkoutForm";
    form.noValidate = true;

    function makeField(id, labelText, inputEl) {
      const field = document.createElement("div");
      field.className = "form-field";
      const label = document.createElement("label");
      label.setAttribute("for", id);
      label.textContent = labelText;
      inputEl.id = id;
      const errorEl = document.createElement("div");
      errorEl.className = "form-error";
      errorEl.id = id + "Error";
      field.appendChild(label);
      field.appendChild(inputEl);
      field.appendChild(errorEl);
      return field;
    }

    const nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.placeholder = "Your name";
    form.appendChild(makeField("checkoutName", "Name", nameInput));

    const phoneInput = document.createElement("input");
    phoneInput.type = "tel";
    phoneInput.placeholder = "10-digit phone number";
    phoneInput.inputMode = "numeric";
    form.appendChild(makeField("checkoutPhone", "Phone", phoneInput));

    const addressInput = document.createElement("textarea");
    addressInput.rows = 3;
    addressInput.placeholder = "Delivery address";
    form.appendChild(makeField("checkoutAddress", "Delivery address", addressInput));

    const payField = document.createElement("div");
    payField.className = "form-field";
    const payLabel = document.createElement("label");
    payLabel.textContent = "How to pay";
    const payOptions = document.createElement("div");
    payOptions.className = "pay-options";

    const codLabel = document.createElement("label");
    codLabel.className = "pay-option";
    const codInput = document.createElement("input");
    codInput.type = "radio";
    codInput.name = "payMethod";
    codInput.value = "cod";
    codInput.checked = true;
    codLabel.appendChild(codInput);
    codLabel.appendChild(document.createTextNode("Cash on delivery"));

    const upiLabel = document.createElement("label");
    upiLabel.className = "pay-option";
    const upiInput = document.createElement("input");
    upiInput.type = "radio";
    upiInput.name = "payMethod";
    upiInput.value = "upi";
    upiLabel.appendChild(upiInput);
    upiLabel.appendChild(document.createTextNode("UPI"));

    payOptions.appendChild(codLabel);
    payOptions.appendChild(upiLabel);
    payField.appendChild(payLabel);
    payField.appendChild(payOptions);
    form.appendChild(payField);

    const placeOrderBtn = document.createElement("button");
    placeOrderBtn.type = "submit";
    placeOrderBtn.className = "place-order-btn";
    placeOrderBtn.textContent = "Place order";
    form.appendChild(placeOrderBtn);

    cartBody.appendChild(form);

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      validateAndPlaceOrder(nameInput, phoneInput, addressInput);
    });
  }

  function setFieldError(id, message) {
    const errorEl = document.getElementById(id + "Error");
    if (errorEl) errorEl.textContent = message || "";
  }

  function validateAndPlaceOrder(nameInput, phoneInput, addressInput) {
    setFieldError("checkoutName", "");
    setFieldError("checkoutPhone", "");
    setFieldError("checkoutAddress", "");

    let valid = true;

    if (cartCount() === 0) {
      cartBody.innerHTML = "";
      const empty = document.createElement("div");
      empty.className = "cart-empty";
      empty.textContent = "Your table is empty — add something before checking out!";
      cartBody.appendChild(empty);
      return;
    }

    const name = nameInput.value.trim();
    if (name === "") {
      setFieldError("checkoutName", "Please tell us your name.");
      valid = false;
    }

    const phone = phoneInput.value.trim();
    if (!/^\d{10}$/.test(phone)) {
      setFieldError("checkoutPhone", "Please enter exactly 10 digits.");
      valid = false;
    }

    const address = addressInput.value.trim();
    if (address === "") {
      setFieldError("checkoutAddress", "Please add a delivery address.");
      valid = false;
    }

    if (!valid) return;

    const payMethodInput = document.querySelector('input[name="payMethod"]:checked');
    const payMethod = payMethodInput ? payMethodInput.value : "cod";

    const order = placeOrder(name, phone, address, payMethod);
    cartOverlay.classList.remove("show");
    goToOrder(order.orderNumber);
  }

  // ============================================================
  // ORDERS — saved to localStorage; order numbers start at 1001.
  // ============================================================
  const ORDERS_STORAGE_KEY = "masalaLaneOrders";
  const TRACKING_STEPS = ["Placed", "Preparing", "On the way", "Delivered"];

  // The in-memory list below is the source of truth for the rest of this
  // page session — it's read from storage once on load, and every change
  // updates it directly (then tries to persist). This way, an order just
  // placed is always found immediately, even if a storage read right after
  // a write is ever unreliable (seen on some browsers for local files).
  function readOrdersFromStorage() {
    try {
      const raw = localStorage.getItem(ORDERS_STORAGE_KEY);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      // saved data is damaged — start fresh instead of breaking the page
      return [];
    }
  }

  let ordersCache = readOrdersFromStorage();

  function loadOrders() {
    return ordersCache;
  }

  function persistOrders() {
    try {
      localStorage.setItem(ORDERS_STORAGE_KEY, JSON.stringify(ordersCache));
    } catch (e) {
      // ignore storage errors (e.g. private browsing) — ordersCache still
      // holds the data for the rest of this page session
    }
  }

  function saveOrders(orders) {
    ordersCache = orders;
    persistOrders();
  }

  function nextOrderNumber(orders) {
    if (orders.length === 0) return 1001;
    return Math.max(...orders.map((o) => o.orderNumber)) + 1;
  }

  function placeOrder(name, phone, address, payMethod) {
    const items = Object.entries(cart).map(([dishName, qty]) => {
      const dish = findDish(dishName);
      return { name: dish.name, price: dish.price, qty: qty };
    });

    const subtotal = cartTotal();
    const discount = cartDiscount();

    const order = {
      orderNumber: nextOrderNumber(ordersCache),
      time: new Date().toISOString(),
      name: name,
      phone: phone,
      address: address,
      payMethod: payMethod,
      items: items,
      subtotal: subtotal,
      discount: discount,
      couponCode: discount > 0 ? COUPON.code : null,
      couponPercent: discount > 0 ? COUPON.percent : null,
      total: subtotal - discount,
      status: "Placed",
    };

    ordersCache.push(order);
    persistOrders();

    cart = {};
    saveCart();
    appliedCouponCode = null;
    saveAppliedCoupon(null);
    couponMessage = "";
    renderCartBar();

    return order;
  }

  cartBar.addEventListener("click", () => {
    renderCartBody();
    cartOverlay.classList.add("show");
  });

  cartCloseBtn.addEventListener("click", () => {
    cartOverlay.classList.remove("show");
  });

  cartOverlay.addEventListener("click", (e) => {
    if (e.target === cartOverlay) cartOverlay.classList.remove("show");
  });

  renderCartBar();

  // ============================================================
  // PAGES + ROUTING — simple hash router: "", "#orders", "#track/<n>"
  // ============================================================
  const pageWelcome = document.getElementById("page-welcome");
  const pageMain = document.getElementById("page-main");
  const pageOrders = document.getElementById("page-orders");
  const pageTracking = document.getElementById("page-tracking");
  const ordersList = document.getElementById("ordersList");
  const myOrdersLink = document.getElementById("myOrdersLink");
  const ordersBackLink = document.getElementById("ordersBackLink");
  const trackingBackLink = document.getElementById("trackingBackLink");
  const trackingTitle = document.getElementById("trackingTitle");
  const trackingContent = document.getElementById("trackingContent");
  const startOrderingBtn = document.getElementById("startOrderingBtn");
  const welcomeTagline = document.getElementById("welcomeTagline");
  const welcomeGreeting = document.getElementById("welcomeGreeting");
  const welcomeSpecial = document.getElementById("welcomeSpecial");
  const welcomeSpecialText = document.getElementById("welcomeSpecialText");
  const welcomeSpecialAddBtn = document.getElementById("welcomeSpecialAddBtn");
  const welcomeContinue = document.getElementById("welcomeContinue");
  const welcomeContinueBtn = document.getElementById("welcomeContinueBtn");
  const welcomeCouponBanner = document.getElementById("welcomeCouponBanner");
  const welcomeFacts = document.getElementById("welcomeFacts");

  // Whether the welcome page should be shown for the root ("") hash.
  // It starts true (shown every time the page opens) and is set to
  // false once the person dismisses it or navigates anywhere by hash.
  let welcomeActive = true;
  let trackingInterval = null;

  function clearTrackingInterval() {
    if (trackingInterval) {
      clearInterval(trackingInterval);
      trackingInterval = null;
    }
  }

  function showPage(id) {
    pageWelcome.classList.toggle("active", id === "welcome");
    pageMain.classList.toggle("active", id === "main");
    pageOrders.classList.toggle("active", id === "orders");
    pageTracking.classList.toggle("active", id === "tracking");
  }

  function findTodaysSpecial() {
    for (const section of MENU) {
      const dish = section.items.find((d) => d.todaysSpecial);
      if (dish) return dish;
    }
    return null;
  }

  function getGreeting() {
    const hour = new Date().getHours();
    for (const g of RESTAURANT.greetings) {
      if (hour < g.maxHour) return g;
    }
    return RESTAURANT.greetings[RESTAURANT.greetings.length - 1];
  }

  function renderWelcomePage() {
    welcomeTagline.textContent = RESTAURANT.tagline;

    const greeting = getGreeting();
    welcomeGreeting.textContent = greeting.it + ", " + greeting.en;

    const special = findTodaysSpecial();
    if (special) {
      welcomeSpecial.classList.add("show");
      welcomeSpecialText.textContent = "Today's Special: " + special.name + " — Rs " + special.price;
    } else {
      welcomeSpecial.classList.remove("show");
    }

    if (cartCount() > 0) {
      welcomeContinue.classList.add("show");
      const count = cartCount();
      welcomeContinueBtn.textContent =
        "Continue your order (" + count + (count === 1 ? " item" : " items") + ")";
    } else {
      welcomeContinue.classList.remove("show");
    }

    const couponAvailable = COUPON.firstOrderOnly ? isFirstOrder() : true;
    welcomeCouponBanner.classList.toggle("show", couponAvailable);

    welcomeFacts.innerHTML = "";
    RESTAURANT.facts.forEach((fact) => {
      const span = document.createElement("span");
      span.className = "welcome-fact";
      span.textContent = fact;
      welcomeFacts.appendChild(span);
    });
  }

  function dismissWelcome(onDone) {
    welcomeActive = false;
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    if (reduceMotion) {
      showPage("main");
      if (onDone) onDone();
      return;
    }

    pageMain.classList.add("active");
    pageWelcome.classList.add("leaving");
    setTimeout(() => {
      pageWelcome.classList.remove("active");
      pageWelcome.classList.remove("leaving");
      if (onDone) onDone();
    }, 500);
  }

  startOrderingBtn.addEventListener("click", () => dismissWelcome());

  welcomeSpecialAddBtn.addEventListener("click", () => {
    const special = findTodaysSpecial();
    if (special) addToCart(special.name);
    dismissWelcome();
  });

  welcomeContinueBtn.addEventListener("click", () => {
    dismissWelcome(() => {
      renderCartBody();
      cartOverlay.classList.add("show");
    });
  });

  function goToOrder(orderNumber) {
    const target = "#track/" + orderNumber;
    if (window.location.hash === target) {
      // hash already points here (e.g. re-opening the same order) — hashchange
      // won't fire on its own, so render directly instead of waiting for it.
      showPage("tracking");
      renderTrackingPage(orderNumber);
    } else {
      window.location.hash = target;
    }
  }

  function renderOrdersPage() {
    ordersList.innerHTML = "";
    const orders = loadOrders().slice().sort((a, b) => b.orderNumber - a.orderNumber);

    if (orders.length === 0) {
      const empty = document.createElement("div");
      empty.className = "no-orders";
      empty.textContent = "You haven't placed any orders yet.";
      ordersList.appendChild(empty);
      return;
    }

    orders.forEach((order) => {
      const card = document.createElement("div");
      card.className = "order-card";
      card.addEventListener("click", () => {
        goToOrder(order.orderNumber);
      });

      const top = document.createElement("div");
      top.className = "order-card-top";
      top.innerHTML = "<span>Order " + order.orderNumber + "</span><span>Rs " + order.total + "</span>";

      const time = document.createElement("div");
      time.className = "order-card-time";
      time.textContent = new Date(order.time).toLocaleString();

      card.appendChild(top);
      card.appendChild(time);

      if (order.discount > 0) {
        const discountLine = document.createElement("div");
        discountLine.className = "order-card-discount";
        discountLine.textContent =
          "Subtotal Rs " + order.subtotal + " — Discount -Rs " + order.discount + " (" + order.couponCode + ")";
        card.appendChild(discountLine);
      }

      const bottom = document.createElement("div");
      bottom.className = "order-card-bottom";
      const statusPill = document.createElement("span");
      statusPill.className = "order-status-pill";
      statusPill.textContent = order.status;
      bottom.appendChild(statusPill);

      card.appendChild(bottom);
      ordersList.appendChild(card);
    });
  }

  function renderTrackingPage(orderNumber) {
    clearTrackingInterval();
    trackingContent.innerHTML = "";

    const orders = loadOrders();
    const order = orders.find((o) => o.orderNumber === orderNumber);

    if (!order) {
      trackingTitle.textContent = "Order not found";
      const notFound = document.createElement("div");
      notFound.className = "order-not-found";

      const message = document.createElement("p");
      message.textContent =
        "We could not find this order. It may have been cleared from this browser.";
      notFound.appendChild(message);

      const backBtn = document.createElement("button");
      backBtn.className = "order-not-found-btn";
      backBtn.textContent = "Back to My Orders";
      backBtn.addEventListener("click", () => {
        window.location.hash = "#orders";
      });
      notFound.appendChild(backBtn);

      trackingContent.appendChild(notFound);
      return;
    }

    trackingTitle.textContent = "Order " + order.orderNumber;

    const time = document.createElement("div");
    time.className = "order-time";
    time.textContent = "Placed " + new Date(order.time).toLocaleString();
    trackingContent.appendChild(time);

    const list = document.createElement("div");
    list.className = "order-summary-list";
    order.items.forEach((item) => {
      const row = document.createElement("div");
      row.className = "order-summary-row";
      row.innerHTML =
        "<span>" + item.name + " x " + item.qty + "</span><span>Rs " + item.price * item.qty + "</span>";
      list.appendChild(row);
    });
    if (order.discount > 0) {
      const subtotalRow = document.createElement("div");
      subtotalRow.className = "order-summary-row";
      subtotalRow.innerHTML = "<span>Subtotal</span><span>Rs " + order.subtotal + "</span>";
      list.appendChild(subtotalRow);

      const discountRow = document.createElement("div");
      discountRow.className = "order-summary-row";
      discountRow.innerHTML =
        "<span>Discount (" + order.couponCode + ", " + order.couponPercent + "%)</span><span>-Rs " + order.discount + "</span>";
      list.appendChild(discountRow);
    }

    const totalRow = document.createElement("div");
    totalRow.className = "order-summary-row";
    totalRow.innerHTML = "<strong>Total</strong><strong>Rs " + order.total + "</strong>";
    list.appendChild(totalRow);
    trackingContent.appendChild(list);

    const stepsRow = document.createElement("div");
    stepsRow.className = "tracking-steps";
    const currentIndex = TRACKING_STEPS.indexOf(order.status);

    TRACKING_STEPS.forEach((step, i) => {
      const stepEl = document.createElement("div");
      stepEl.className = "tracking-step";
      if (i < currentIndex) stepEl.classList.add("done");
      if (i === currentIndex) stepEl.classList.add("current");

      const dot = document.createElement("div");
      dot.className = "tracking-step-dot";
      dot.textContent = i < currentIndex ? "✓" : i + 1;

      const label = document.createElement("div");
      label.className = "tracking-step-label";
      label.textContent = step;

      stepEl.appendChild(dot);
      stepEl.appendChild(label);
      stepsRow.appendChild(stepEl);
    });
    trackingContent.appendChild(stepsRow);

    if (currentIndex < TRACKING_STEPS.length - 1) {
      const note = document.createElement("div");
      note.className = "demo-note";
      note.textContent = "Demo: in a real restaurant the kitchen moves this.";
      trackingContent.appendChild(note);

      trackingInterval = setInterval(() => {
        const freshOrders = loadOrders();
        const freshOrder = freshOrders.find((o) => o.orderNumber === orderNumber);
        if (!freshOrder) {
          clearTrackingInterval();
          return;
        }
        const idx = TRACKING_STEPS.indexOf(freshOrder.status);
        if (idx >= TRACKING_STEPS.length - 1) {
          clearTrackingInterval();
          return;
        }
        freshOrder.status = TRACKING_STEPS[idx + 1];
        saveOrders(freshOrders);
        renderTrackingPage(orderNumber);
      }, 10000);
    }
  }

  function router() {
    const hash = window.location.hash;
    if (hash === "#orders") {
      welcomeActive = false;
      clearTrackingInterval();
      showPage("orders");
      renderOrdersPage();
    } else if (hash.indexOf("#track/") === 0) {
      welcomeActive = false;
      const orderNumber = parseInt(hash.slice("#track/".length), 10);
      showPage("tracking");
      renderTrackingPage(orderNumber);
    } else {
      clearTrackingInterval();
      if (welcomeActive) {
        renderWelcomePage();
        showPage("welcome");
        startOrderingBtn.focus();
      } else {
        showPage("main");
      }
    }
  }

  myOrdersLink.addEventListener("click", () => {
    window.location.hash = "#orders";
  });

  ordersBackLink.addEventListener("click", () => {
    window.location.hash = "";
  });

  trackingBackLink.addEventListener("click", () => {
    window.location.hash = "#orders";
  });

  window.addEventListener("hashchange", router);
  router();
</script>

</body>
</html>
